<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nothing-phone 風：象牙白底 + 點陣 + 像素雷達 + 橘色突破點 -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>
  <!-- 點陣背景 -->
  <g fill="#e6e3db">
    <circle cx="64" cy="64" r="4"/><circle cx="128" cy="64" r="4"/><circle cx="192" cy="64" r="4"/><circle cx="256" cy="64" r="4"/><circle cx="320" cy="64" r="4"/><circle cx="384" cy="64" r="4"/><circle cx="448" cy="64" r="4"/>
    <circle cx="64" cy="128" r="4"/><circle cx="128" cy="128" r="4"/><circle cx="192" cy="128" r="4"/><circle cx="256" cy="128" r="4"/><circle cx="320" cy="128" r="4"/><circle cx="384" cy="128" r="4"/><circle cx="448" cy="128" r="4"/>
    <circle cx="64" cy="192" r="4"/><circle cx="128" cy="192" r="4"/><circle cx="192" cy="192" r="4"/><circle cx="256" cy="192" r="4"/><circle cx="320" cy="192" r="4"/><circle cx="384" cy="192" r="4"/><circle cx="448" cy="192" r="4"/>
    <circle cx="64" cy="256" r="4"/><circle cx="128" cy="256" r="4"/><circle cx="192" cy="256" r="4"/><circle cx="256" cy="256" r="4"/><circle cx="320" cy="256" r="4"/><circle cx="384" cy="256" r="4"/><circle cx="448" cy="256" r="4"/>
    <circle cx="64" cy="320" r="4"/><circle cx="128" cy="320" r="4"/><circle cx="192" cy="320" r="4"/><circle cx="256" cy="320" r="4"/><circle cx="320" cy="320" r="4"/><circle cx="384" cy="320" r="4"/><circle cx="448" cy="320" r="4"/>
    <circle cx="64" cy="384" r="4"/><circle cx="128" cy="384" r="4"/><circle cx="192" cy="384" r="4"/><circle cx="256" cy="384" r="4"/><circle cx="320" cy="384" r="4"/><circle cx="384" cy="384" r="4"/><circle cx="448" cy="384" r="4"/>
    <circle cx="64" cy="448" r="4"/><circle cx="128" cy="448" r="4"/><circle cx="192" cy="448" r="4"/><circle cx="256" cy="448" r="4"/><circle cx="320" cy="448" r="4"/><circle cx="384" cy="448" r="4"/><circle cx="448" cy="448" r="4"/>
  </g>

  <!-- 雷達同心圓（黑色細線） -->
  <g fill="none" stroke="#000000" stroke-opacity=".9">
    <circle cx="256" cy="256" r="150" stroke-width="10"/>
    <circle cx="256" cy="256" r="98" stroke-width="8"/>
    <circle cx="256" cy="256" r="48" stroke-width="7"/>
  </g>
  <!-- 十字準星 -->
  <g stroke="#000000" stroke-opacity=".28" stroke-width="6">
    <line x1="256" y1="86" x2="256" y2="426"/>
    <line x1="86" y1="256" x2="426" y2="256"/>
  </g>

  <!-- 掃描前緣（黑色雷達臂，指向突破點方向） -->
  <line x1="256" y1="256" x2="386" y2="166" stroke="#000000" stroke-width="11" stroke-linecap="round"/>

  <!-- 橘色突破點 blip -->
  <circle cx="366" cy="150" r="40" fill="#ff6a1a"/>
  <circle cx="366" cy="150" r="15" fill="#ffffff"/>

  <!-- 中心點 -->
  <circle cx="256" cy="256" r="12" fill="#000000"/>
</svg>
