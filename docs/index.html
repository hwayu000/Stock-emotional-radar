<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashdata 注意力雷達</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon-256.png">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Doto:wght@400..900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     NOTHING OS × 極簡主義 · 暖白/暖黑 + 疏點陣 + 克制橘點綴
     Space Mono ALL CAPS、Pill 膠囊、[括號]語法、方塊分段條、
     左側 accent bar。大量留白、克制發光（無掃描/呼吸動畫）。
     ============================================================ */
  :root {
    --radius: 14px;
    --speed: 200ms;
    --ease: cubic-bezier(.25,.1,.25,1);
    --font-ui: "Space Grotesk", "PingFang TC", "Microsoft JhengHei UI", system-ui, sans-serif;
    --font-mono: "Space Mono", "SF Mono", "JetBrains Mono", monospace;
    --font-dot: "Doto", "Space Mono", monospace;   /* Ndot 風點陣字 */
    --accent: #ff6a1a;      /* 橘 LED */
    --accent-soft: #fff1e8;
    --accent-glow: rgba(255,106,26,.55);
  }
  /* —— 日間：暖白極簡（大量留白·克制點綴） —— */
  html[data-theme="light"] {
    --bg:#f4f1ea; --dot:rgba(60,52,38,.055);
    --surface:#ffffff; --surface-2:rgba(255,255,255,.72);
    --stroke:#eae6dd; --stroke-hi:#d6d0c4;
    --text:#1a1814; --text-dim:#6b6459; --text-faint:#a39c8f;
    --grid:rgba(26,24,20,.06);
    --c-vol:#1a1814; --c-kl:var(--accent); --c-thresh:#d0342c; --c-price:#1a1814;
    --c-mark:var(--accent); --c-pos:#3d8a56; --c-neg:#cf4437; --c-attn:#3a6ea5;
    --chip-pos-bg:rgba(61,138,86,.09); --chip-neg-bg:rgba(207,68,55,.09); --chip-neu-bg:rgba(60,52,38,.055);
    --tip-bg:#1a1814; --tip-text:#f7f5ef;
    --seg-on-bg:#1a1814; --seg-on-text:#ffffff;
    --shadow:0 8px 28px rgba(60,52,38,.045);
  }
  /* —— 夜間：暖黑極簡 —— */
  html[data-theme="dark"] {
    --bg:#0d0c0b; --dot:rgba(245,240,230,.05);
    --surface:#171614; --surface-2:rgba(255,255,255,.035);
    --stroke:#282622; --stroke-hi:#39362f;
    --text:#f2efe8; --text-dim:#a5a096; --text-faint:#6d6960;
    --grid:rgba(245,240,230,.06);
    --c-vol:#f2efe8; --c-kl:var(--accent); --c-thresh:#f0655a; --c-price:#f2efe8;
    --c-mark:var(--accent); --c-pos:#5ac07f; --c-neg:#f0655a; --c-attn:#6a9bd0;
    --chip-pos-bg:rgba(90,192,127,.12); --chip-neg-bg:rgba(240,101,90,.12); --chip-neu-bg:rgba(245,240,230,.055);
    --tip-bg:#f2efe8; --tip-text:#0d0c0b;
    --seg-on-bg:#f2efe8; --seg-on-text:#0d0c0b;
    --shadow:0 14px 40px rgba(0,0,0,.45);
  }
  html[data-contrast="high"][data-theme="light"] { --text:#000; --text-dim:#3a382f; }
  html[data-contrast="high"][data-theme="dark"]  { --text:#fff; --text-dim:#d8d4c8; }

  * { margin:0; padding:0; box-sizing:border-box; }
  *::selection { background:var(--accent); color:#fff; }
  html { font-size:100%; }
  html[data-fs="l"]  { font-size:110%; }
  html[data-fs="xl"] { font-size:120%; }

  body {
    font-family:var(--font-ui); font-weight:500;
    color:var(--text); min-height:100vh; position:relative;
    background:
      radial-gradient(circle, var(--dot) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--bg);
    transition:background var(--speed), color var(--speed);
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1120px; margin:0 auto; padding:2rem 1.4rem 5rem; }

  /* ===== 開場 LED 啟動：整頁淡入 + 元素逐一點亮 ===== */
  @keyframes bootIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .boot { opacity:0; animation:bootIn .55s var(--ease) forwards; }
  .boot.d1{animation-delay:.05s} .boot.d2{animation-delay:.13s} .boot.d3{animation-delay:.22s}
  .boot.d4{animation-delay:.32s} .boot.d5{animation-delay:.42s}

  /* ===== 數字滾動點亮 ===== */
  @keyframes valIn { from{opacity:0; letter-spacing:.1em; filter:blur(4px);} to{opacity:1; letter-spacing:-.02em; filter:none;} }
  .val.animval { animation:valIn .5s var(--ease) both; }

  /* ================= Header ================= */
  header { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1.6rem; }
  .brand { display:flex; align-items:center; gap:.85rem; }
  .brand .mark { width:3rem; height:3rem; flex-shrink:0; }
  h1 { font-family:var(--font-dot); font-size:2rem; font-weight:700; letter-spacing:.02em; line-height:1; }
  .brand .tag { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); margin-top:.45rem; }
  .brand .tag::before { content:"[ "; } .brand .tag::after { content:" ]"; }
  .head-right { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .stamp { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.02em; color:var(--text-faint); text-align:right; line-height:1.7; text-transform:uppercase; }
  .stamp .stale { color:var(--accent); font-weight:700; }

  .iconbtn {
    appearance:none; cursor:pointer; width:2.7rem; height:2.7rem; border-radius:10px; position:relative; overflow:hidden;
    border:1px solid var(--stroke-hi); background:var(--surface); color:var(--text);
    display:inline-flex; align-items:center; justify-content:center;
    transition:border-color var(--speed), color var(--speed);
  }
  /* hover：橘光由左掃過 */
  .iconbtn::before {
    content:""; position:absolute; inset:0; background:var(--accent); opacity:0;
    transform:translateX(-101%); transition:transform .35s var(--ease), opacity var(--speed);
  }
  .iconbtn:hover { border-color:var(--accent); }
  .iconbtn:hover::before { opacity:.14; transform:translateX(0); }
  .iconbtn:active { border-color:var(--accent); }
  .iconbtn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .iconbtn svg { width:1.25rem; height:1.25rem; position:relative; z-index:1; }

  /* ================= Card ================= */
  .card {
    background:var(--surface); border:1px solid var(--stroke); position:relative;
    border-radius:var(--radius); box-shadow:var(--shadow);
    transition:border-color var(--speed), box-shadow var(--speed);
  }
  .card.pad { padding:1.4rem 1.5rem; }
  /* hover：左側 accent bar 由上滑出（Nothing active-row 語彙） */
  .chart-card::before, .stat::before {
    content:""; position:absolute; left:-1px; top:12px; bottom:12px; width:2px; background:var(--accent);
    transform:scaleY(0); transform-origin:top; transition:transform .3s var(--ease); border-radius:2px;
  }
  .card.hoverable:hover { border-color:var(--stroke-hi); }
  .card.hoverable:hover::before { transform:scaleY(1); }
  .stat:hover::before { transform:scaleY(1); }

  /* ================= Segmented ================= */
  .toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.8rem; margin-bottom:1.2rem; }
  .seg { display:inline-flex; padding:.3rem; gap:.2rem; border-radius:999px; border:1px solid var(--stroke-hi); background:var(--surface); }
  .seg button {
    appearance:none; border:0; background:transparent; color:var(--text-dim); cursor:pointer;
    font-family:var(--font-mono); font-weight:700; font-size:.8rem; padding:.6rem 1.1rem; border-radius:999px;
    transition:color var(--speed), background var(--speed);
    display:inline-flex; align-items:center; gap:.5rem; letter-spacing:.06em; text-transform:uppercase;
  }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .seg button.on { color:var(--seg-on-text); background:var(--seg-on-bg); }
  .seg .dot { width:.5rem; height:.5rem; border-radius:50%; background:var(--c-pos); }
  .seg .dot.alert { background:var(--accent); animation:pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .seg.mini button { padding:.5rem .85rem; font-size:.76rem; }
  @media (prefers-reduced-motion:reduce){
    .seg .dot.alert,.brand .mark{animation:none!important;}
    .boot{animation:none!important;opacity:1!important;transform:none!important;}
    *{transition:none!important;}
  }

  /* ================= 統計卡 ================= */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr)); gap:1rem; margin-bottom:1.2rem; }
  .stat { padding:1.2rem 1.35rem; overflow:hidden; display:flex; flex-direction:column; }
  /* 標籤區可換行（未定版徽章會擠成第二行），數值一律貼齊卡片底部，四張卡看齊 */
  .stat .lbl { font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); letter-spacing:.07em; text-transform:uppercase; margin-bottom:.7rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .stat .val { margin-top:auto; }
  .stat .val { font-family:var(--font-mono); font-size:2.2rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.01em; line-height:1; }
  .stat .hint { font-family:var(--font-mono); font-size:.74rem; color:var(--text-faint); margin-top:.55rem; line-height:1.6; letter-spacing:.02em; }
  .badge { font-family:var(--font-mono); font-size:.64rem; font-weight:700; padding:.24rem .55rem; border-radius:999px; letter-spacing:.06em; text-transform:uppercase; border:1px solid transparent; }
  .badge.ok   { background:transparent; color:var(--c-pos); border-color:var(--c-pos); }
  .badge.warn { background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  html[data-theme="dark"] .badge.warn { background:rgba(255,106,26,.14); }

  /* ================= Tab 導覽（ALL CAPS + LED 底線） ================= */
  .tabbar { display:flex; gap:.15rem; margin-bottom:1.1rem; border-bottom:1px solid var(--stroke); flex-wrap:wrap; }
  .tabbar button {
    appearance:none; border:0; background:transparent; cursor:pointer; position:relative;
    font-family:var(--font-mono); font-weight:700; font-size:.8rem; letter-spacing:.05em; text-transform:uppercase; color:var(--text-dim);
    padding:.75rem 1rem; margin-bottom:-1px;
    transition:color var(--speed); display:inline-flex; align-items:center; gap:.45rem;
  }
  /* 底線 LED：hover 半亮、選中全亮並發光 */
  .tabbar button::after {
    content:""; position:absolute; left:.6rem; right:.6rem; bottom:-1px; height:2px; background:var(--accent);
    transform:scaleX(0); transform-origin:left; transition:transform .28s var(--ease), box-shadow var(--speed);
  }
  .tabbar button:hover { color:var(--text); }
  .tabbar button:hover::after { transform:scaleX(1); opacity:.4; }
  .tabbar button.on { color:var(--text); }
  .tabbar button.on::after { transform:scaleX(1); opacity:1; }
  .tabbar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  .tabbar .tdot { width:.42rem; height:.42rem; border-radius:50%; background:var(--accent); animation:pulse 1.6s infinite; }

  .tabpage { display:none; }
  .tabpage.on { display:block; }
  /* 分頁內卡片逐格 LED 點亮進場 */
  .tabpage.on .card { animation:cardBoot .42s var(--ease) both; }
  .tabpage.on .card:nth-child(1){animation-delay:.02s}
  .tabpage.on .card:nth-child(2){animation-delay:.10s}
  .tabpage.on .card:nth-child(3){animation-delay:.18s}
  .tabpage.on .card:nth-child(4){animation-delay:.26s}
  .tabpage.on .charts>.card:nth-child(1){animation-delay:.02s}
  .tabpage.on .charts>.card:nth-child(2){animation-delay:.10s}
  .tabpage.on .charts>.card:nth-child(3){animation-delay:.18s}
  .tabpage.on .charts>.card:nth-child(4){animation-delay:.26s}
  @keyframes cardBoot { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* ================= 圖表卡 ================= */
  .charts { display:grid; gap:1.1rem; }
  .chart-card { padding:1.35rem 1.5rem 1rem; }
  .chart-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:.5rem; flex-wrap:wrap; gap:.5rem; }
  .chart-head h3 { font-family:var(--font-mono); font-size:.92rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:flex; align-items:center; gap:.5rem; }
  .chart-head .legend { display:flex; gap:.4rem; flex-wrap:wrap; }
  /* 可點擊圖例（LED chip） */
  .lgc {
    font-family:var(--font-mono); font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim); cursor:pointer;
    display:inline-flex; align-items:center; gap:.4rem; padding:.32rem .65rem; border-radius:999px; position:relative; overflow:hidden;
    border:1px solid var(--stroke-hi); background:var(--surface); user-select:none;
    transition:opacity var(--speed), border-color var(--speed), color var(--speed);
  }
  .lgc:hover { border-color:var(--accent); color:var(--text); }
  .lgc i { width:1.1rem; height:3px; border-radius:2px; display:inline-block; }
  .lgc i.dotmark { width:.55rem; height:.55rem; border-radius:50%; }
  .lgc.off { opacity:.35; border-style:dashed; }
  .lgc.off i { background:var(--text-faint)!important; }
  .lgc:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  canvas { width:100%; height:220px; display:block; cursor:crosshair; }
  /* 用 text-dim 而非 text-faint：faint 對比僅 3.31:1 未達 WCAG AA 4.5:1 */
  .axis-note { font-family:var(--font-mono); font-size:.66rem; color:var(--text-dim); display:flex; justify-content:space-between; margin-top:.35rem; }

  .tip {
    position:fixed; z-index:50; pointer-events:none; display:none;
    padding:.65rem .85rem; border-radius:10px; font-size:.78rem; line-height:1.7;
    background:var(--tip-bg); color:var(--tip-text);
    box-shadow:0 12px 34px rgba(0,0,0,.3); font-family:var(--font-mono);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .tip.wide { white-space:normal; max-width:20rem; font-family:var(--font-ui); line-height:1.7; }

  /* ================= 美股排行 ================= */
  .rankrow {
    display:grid; grid-template-columns:2.2rem 9.5rem 1fr 4.5rem; align-items:center; gap:.85rem; position:relative;
    padding:.85rem 1rem .85rem 1.15rem; border-radius:10px; cursor:pointer; border:1px solid transparent;
    transition:background var(--speed), border-color var(--speed);
  }
  /* 左側 accent bar（選中/懸停） */
  .rankrow::before { content:""; position:absolute; left:2px; top:14px; bottom:14px; width:2px; background:var(--accent); border-radius:2px; transform:scaleY(0); transform-origin:top; transition:transform .28s var(--ease); }
  .rankrow:hover { background:var(--chip-neu-bg); }
  .rankrow:hover::before { transform:scaleY(.6); }
  .rankrow.on { background:var(--chip-neu-bg); }
  .rankrow.on::before { transform:scaleY(1); }
  .rankrow:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .rankrow .rk { font-family:var(--font-dot); font-size:1.5rem; font-weight:700; color:var(--text-faint); text-align:center; }
  .rankrow.on .rk { color:var(--accent); }
  .rankrow .nm { font-size:.98rem; font-weight:600; }
  .rankrow .nm small { display:block; font-family:var(--font-mono); font-weight:400; font-size:.7rem; letter-spacing:.02em; color:var(--text-faint); margin-top:.2rem; }
  /* 方塊分段條（Nothing 招牌）：12 格、2px gap、方角 */
  .rankbar { display:flex; gap:2px; height:.62rem; }
  .rankbar .seg-cell { flex:1; background:var(--chip-neu-bg); transition:background .35s var(--ease); }
  .rankbar .seg-cell.lit { background:var(--accent); }
  .rankrow .hv { font-family:var(--font-mono); font-size:.82rem; font-variant-numeric:tabular-nums; color:var(--text-dim); text-align:right; }
  .scanned { font-family:var(--font-mono); font-size:.7rem; letter-spacing:.02em; color:var(--text-faint); margin-top:.8rem; padding:0 1rem; line-height:1.9; }

  /* ================= 語料分類（方塊分段分佈條） ================= */
  .dist-bar { display:flex; gap:2px; height:.7rem; margin:.9rem 0 1rem; }
  .dist-bar div { transition:width .5s var(--ease); }
  .art-list { max-height:30rem; overflow-y:auto; display:flex; flex-direction:column; gap:.5rem; scrollbar-width:thin; padding-right:.25rem; }
  .art {
    display:flex; align-items:center; gap:.8rem; padding:.75rem .95rem; border-radius:10px;
    background:var(--chip-neu-bg); border:1px solid transparent;
    text-decoration:none; color:var(--text); cursor:pointer;
    transition:background var(--speed), border-color var(--speed);
  }
  .art:hover { border-color:var(--accent); }
  .art:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .art .t { font-size:.9rem; line-height:1.5; flex:1; min-width:0; overflow-wrap:anywhere; }
  .art .d { font-family:var(--font-mono); font-size:.68rem; color:var(--text-faint); white-space:nowrap; text-align:right; flex-shrink:0; }
  @media (max-width:400px){ .art{gap:.5rem; padding:.65rem .7rem;} .art .d{font-size:.62rem;} .art .t{font-size:.84rem;} }
  .chip { flex-shrink:0; font-family:var(--font-mono); font-size:.62rem; font-weight:700; padding:.24rem .55rem; border-radius:999px; letter-spacing:.05em; text-transform:uppercase; border:1px solid; background:transparent; }
  .chip.pos { color:var(--c-pos); border-color:var(--c-pos); }
  .chip.neg { color:var(--c-neg); border-color:var(--c-neg); }
  .chip.neu { color:var(--text-dim); border-color:var(--stroke-hi); }

  /* ================= 領先關係 ================= */
  .verdict { font-size:1.35rem; font-weight:700; margin:.2rem 0 1.2rem; display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; letter-spacing:-.01em; }
  .verdict .vsub { font-size:.86rem; font-weight:400; color:var(--text-dim); line-height:1.6; }
  .flow { display:grid; grid-template-columns:auto 1fr auto; gap:.1rem 1.2rem; align-items:center; padding:.3rem 0 .7rem; }
  .flow .node { padding:.7rem 1.15rem; border-radius:10px; border:1px solid var(--stroke-hi); background:var(--surface); font-weight:700; font-size:.95rem; text-align:center; }
  .lane { position:relative; padding:1.15rem 0 .7rem; }
  .lane .lbl2 { position:absolute; top:0; left:0; right:0; font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); display:flex; justify-content:space-between; gap:.5rem; }

  /* ================= 資訊 tooltip ================= */
  .info { display:inline-flex; width:1.05rem; height:1.05rem; color:var(--text-faint); cursor:help; vertical-align:-2px; flex-shrink:0; }
  .info:hover { color:var(--accent); }
  .info:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:50%; }
  .info svg { width:100%; height:100%; }

  /* ============ 資料可信度：白話層 + 可展開的嚴謹層 ============ */
  .plain-h { font-size:1.05rem; font-weight:700; margin:0 0 1rem; letter-spacing:.01em; }
  .plain-block { padding:.9rem 0; border-bottom:1px solid var(--line); }
  .plain-block:last-child { border-bottom:none; }
  .plain-q { font-family:var(--font-mono); font-size:.76rem; letter-spacing:.05em;
    color:var(--accent); margin-bottom:.55rem; }
  .plain p { font-size:.9rem; line-height:1.85; margin:.35rem 0; color:var(--text); }
  .plain-key { padding:.6rem .8rem; background:var(--accent-soft); border-radius:8px;
    color:var(--text) !important; margin-top:.6rem !important; }
  html[data-theme="dark"] .plain-key { background:rgba(255,106,26,.11); }
  .plain-list { list-style:none; padding:0; margin:.5rem 0; }
  .plain-list li { font-size:.88rem; line-height:1.9; margin-bottom:.35rem; color:var(--text); }
  .plain-list .tag { display:inline-block; font-family:var(--font-mono); font-size:.68rem;
    padding:.12rem .5rem; border-radius:999px; border:1px solid currentColor; margin-right:.45rem; }
  .plain-list .tag.dim { color:var(--text-dim); }
  .plain-list .tag.pos { color:var(--c-pos); }
  .plain-list .tag.acc { color:var(--accent); }
  .rigor { margin-top:1.4rem; border-top:1px solid var(--line); padding-top:1rem; }
  .rigor > summary { cursor:pointer; font-family:var(--font-mono); font-size:.76rem;
    letter-spacing:.05em; color:var(--text-dim); padding:.4rem 0; list-style:none; }
  .rigor > summary::-webkit-details-marker { display:none; }
  .rigor > summary::before { content:'▸ '; color:var(--accent); }
  .rigor[open] > summary::before { content:'▾ '; }
  .rigor > summary:hover { color:var(--accent); }

  /* ================= 自訂日期區間面板 ================= */
  .rangepicker {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:80; width:min(22rem, calc(100vw - 2rem)); padding:1.35rem 1.45rem; display:none;
    box-shadow:0 18px 50px rgba(0,0,0,.28);
  }
  .rangepicker.open { display:block; animation:fadeIn .2s var(--ease) both; }
  .rangepicker h4 { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-dim); margin:0 0 .9rem; }
  .rp-row { display:flex; align-items:center; gap:.8rem; margin-bottom:.7rem; }
  .rp-row label { font-family:var(--font-mono); font-size:.78rem; color:var(--text-dim); width:1.6rem; }
  .rp-row input[type="date"] {
    flex:1; font-family:var(--font-mono); font-size:.86rem; padding:.5rem .6rem;
    border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--text);
    color-scheme:light dark;   /* 讓原生日曆圖示在深色模式下也看得見 */
  }
  .rp-hint { font-family:var(--font-mono); font-size:.68rem; color:var(--text-dim); margin:.2rem 0 1rem; }
  .rp-btns { display:flex; gap:.6rem; justify-content:flex-end; }
  .rp-btns button {
    font-family:var(--font-mono); font-size:.8rem; padding:.5rem 1rem; border-radius:999px;
    border:1px solid var(--line); background:transparent; color:var(--text); cursor:pointer;
  }
  .rp-btns button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rp-btns button:hover { border-color:var(--accent); }

  /* ================= 設定面板 ================= */
  .panel {
    position:fixed; top:5rem; right:1.4rem; z-index:60; width:16rem; padding:1.25rem 1.35rem;
    display:none;
  }
  .panel.open { display:block; animation:fadeIn .22s var(--ease) both; }
  .panel h4 { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin:.9rem 0 .5rem; }
  .panel h4:first-child { margin-top:0; }
  .panel .seg { width:100%; }
  .panel .seg button { flex:1; justify-content:center; padding:.55rem .3rem; font-size:.82rem; }

  /* 用 text-dim 而非 text-faint：faint 在此字級下對比僅 2.54:1，未達 WCAG AA 4.5:1 */
  .foot { margin-top:2rem; font-family:var(--font-mono); font-size:.72rem; color:var(--text-dim); line-height:1.8; text-align:center; }
  /* 加底線提升可辨識度：純橘字在深底上對比僅 2.54:1，未達 WCAG AA */
  .foot a { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

  @media (max-width:640px){
    .te-grid{grid-template-columns:1fr;} h1{font-size:1.6rem;}
    .rankrow{grid-template-columns:1.8rem 6.5rem 1fr 3.4rem;}
    .panel{right:.7rem; left:.7rem; width:auto;}
    .stat .val{font-size:2rem;}
    .wrap{padding:1.4rem 1rem 4rem;}
  }
</style>

<!-- 自訂日期區間面板 -->
<div class="rangepicker card pad" id="rangePicker" role="dialog" aria-label="自訂日期區間">
  <h4>自訂區間</h4>
  <div class="rp-row"><label for="rpFrom">起</label><input type="date" id="rpFrom"></div>
  <div class="rp-row"><label for="rpTo">迄</label><input type="date" id="rpTo"></div>
  <div class="rp-hint" id="rpHint"></div>

    <button type="button" id="rpApply" class="primary">套用</button>

<div class="tip" id="tip"></div>

<script src="data.js"></script>
<script>
const D = window.RADAR_DATA;
const $ = id => document.getElementById(id);
const fmt = (v,n=2) => v==null ? "—" : (+v).toFixed(n);
const pct = v => (v>=0?'+':'') + v.toFixed(2) + '%';

/* 注意力警戒值：與 radar.py 的 ATTN_THRESHOLD 保持一致。
   由 2.0 上調為 2.5 —— 事件研究(5資產×362天、置換檢定10000次、BH-FDR校正)顯示
   z>2.0 僅 1D 顯著、3D/5D 不顯著；z>2.5 才在 1D/3D/5D/10D 全期間穩定顯著。 */
const ATTN_TH = 2.5;

/* ================= 偏好 ================= */
const PREFS_KEY = 'radar_prefs_v2';
let prefs = { theme:null, fs:'m', contrast:'std', range:'ALL', tab:0 };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || '{}')); } catch(e){}
if (!prefs.theme) prefs.theme = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
function savePrefs(){ try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch(e){} }
function applyPrefs(){
  const r = document.documentElement;
  r.setAttribute('data-theme', prefs.theme);
  r.setAttribute('data-fs', prefs.fs);
  r.setAttribute('data-contrast', prefs.contrast);
  $('themeBtn').innerHTML = prefs.theme === 'dark'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
}

/* ================= 狀態 ================= */
let cur = 0, usMember = 0;
/* 範圍選項。資料期間隨 GDELT 歷史累積會變長（最長可回溯 2017），
   故長期選項只在資料真的夠長時才顯示，避免給出空按鈕。 */
const ALL_RANGES = [['7D',7],['30D',30],['90D',90],['1Y',365],['3Y',1095],['5Y',1825],['ALL',0]];
function availRanges(){
  const n = Math.max(...D.assets.map(a => a.is_group
    ? Math.max(...a.members.map(m => m.dates.length)) : a.dates.length));
  // 只保留「資料量撐得起」的檔位：需比該檔位多 20% 才有意義，ALL 永遠保留
  return ALL_RANGES.filter(r => r[1] === 0 || n >= r[1] * 1.2 || r[1] <= 90);
}
const RANGES = availRanges();
// 綜合疊圖：哪些線開著
let overlayOn = { price:true, kl:true, attn:true };

function activeAsset(){ const a = D.assets[cur]; return a.is_group ? a.members[usMember] : a; }

/* 依 prefs 切出要顯示的區間。支援兩種模式：
   - 檔位模式（7D/30D/…/ALL）：取最後 N 天
   - 自訂模式（prefs.customFrom/customTo）：取日期區間，供回看特定歷史事件 */
function sliced(a){
  if (prefs.range === 'CUSTOM' && prefs.customFrom && prefs.customTo){
    const i0 = a.dates.findIndex(d => d >= prefs.customFrom);
    let i1 = -1;
    for (let k = a.dates.length - 1; k >= 0; k--){ if (a.dates[k] <= prefs.customTo){ i1 = k; break; } }
    if (i0 < 0 || i1 < 0 || i1 < i0) return a;      // 區間無資料 -> 退回全部
    const cut = arr => Array.isArray(arr) ? arr.slice(i0, i1 + 1) : arr;
    return { ...a, dates:cut(a.dates), vol:cut(a.vol), tone:cut(a.tone),
             attn_z:cut(a.attn_z), kl:cut(a.kl), kl_q95:cut(a.kl_q95),
             kl_dir:cut(a.kl_dir), close:cut(a.close), provisional:cut(a.provisional) };
  }
  const hit = RANGES.find(r => r[0] === prefs.range);
  const days = hit ? hit[1] : 0;
  if (!days || a.dates.length <= days) return a;
  const cut = arr => Array.isArray(arr) ? arr.slice(-days) : arr;
  return { ...a, dates:cut(a.dates), vol:cut(a.vol), tone:cut(a.tone),
           attn_z:cut(a.attn_z), kl:cut(a.kl), kl_q95:cut(a.kl_q95),
           kl_dir:cut(a.kl_dir), close:cut(a.close), provisional:cut(a.provisional) };
}
function palette(){
  const cs = getComputedStyle(document.documentElement);
  const g = k => cs.getPropertyValue(k).trim();
  return { vol:g('--c-vol'), kl:g('--c-kl'), thresh:g('--c-thresh'), price:g('--c-price'),
           mark:g('--c-mark'), attn:g('--c-attn'), grid:g('--grid'), label:g('--text-faint') };
}

/* ================= Header 時間 ================= */
function buildStamp(){
  const gen = D.generated_utc ? new Date(D.generated_utc) : new Date(D.generated.replace(' ','T'));
  const disp = gen.toLocaleString('sv-SE').slice(0,16);
  const hrs = Math.max(0, (Date.now() - gen.getTime()) / 36e5);
  const rel = hrs < 1 ? `${Math.round(hrs*60)} 分鐘前` : hrs < 24 ? `${hrs.toFixed(1)} 小時前` : `${(hrs/24).toFixed(1)} 天前`;
  const stale = hrs > 8 ? `<br><span class="stale">數據超過 8 小時未更新</span>` : '';
  $('stamp').innerHTML = `更新 ${disp}<br>${rel}${stale}`;
}

/* ================= Segmented ================= */
function segBuild(el, items, activeIdx, onPick){
  el.innerHTML = '';
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.innerHTML = it.html || it.label;
    b.className = i === activeIdx ? 'on' : '';
    b.onclick = () => onPick(i);
    el.appendChild(b);
  });
}
function buildTabs(){
  segBuild($('seg'),
    D.assets.map(a => {
      const alert = a.alerts && (a.alerts.kl_breach || a.alerts.attention_spike);
      return { html:`<span class="dot${alert?' alert':''}"></span>${a.name}` };
    }),
    cur, i => { cur = i; usMember = 0; if(prefs.tab===4 && !D.assets[i].is_group) setTab(0); render(); });
  // 最後一顆是自訂區間，開啟日期挑選面板
  const items = RANGES.map(r=>({label:r[0]})).concat([{label:'自訂'}]);
  const activeIdx = prefs.range === 'CUSTOM'
    ? items.length - 1 : RANGES.findIndex(r=>r[0]===prefs.range);
  segBuild($('rangeSeg'), items, activeIdx, i => {
    if (i === items.length - 1){ openRangePicker(); return; }
    prefs.range = RANGES[i][0]; savePrefs(); render();
  });
}

/* ================= 自訂日期區間 ================= */
function dataBounds(){
  let lo = null, hi = null;
  const scan = a => { if(!a.dates || !a.dates.length) return;
    if (lo === null || a.dates[0] < lo) lo = a.dates[0];
    if (hi === null || a.dates[a.dates.length-1] > hi) hi = a.dates[a.dates.length-1]; };
  D.assets.forEach(a => a.is_group ? a.members.forEach(scan) : scan(a));
  return [lo, hi];
}
function openRangePicker(){
  const [lo, hi] = dataBounds();
  const f = prefs.customFrom || lo, t = prefs.customTo || hi;
  $('rpFrom').min = lo; $('rpFrom').max = hi; $('rpFrom').value = f;
  $('rpTo').min = lo;   $('rpTo').max = hi;   $('rpTo').value = t;
  $('rpHint').textContent = `可選範圍 ${lo} ~ ${hi}`;
  $('rangePicker').classList.add('open');
}
function applyRangePicker(){
  const f = $('rpFrom').value, t = $('rpTo').value;
  if (!f || !t){ return; }
  prefs.customFrom = f <= t ? f : t;
  prefs.customTo   = f <= t ? t : f;
  prefs.range = 'CUSTOM';
  savePrefs();
  $('rangePicker').classList.remove('open');
  render();
}

function regimeTag(vr, isAlert){
  if (!vr || !vr.level) return '';
  const map = {
    '低': ['var(--text-dim)', '此區間訊號多為雜訊'],
    '中': ['var(--c-pos)',    '訊號最有效的區間'],
    '高': ['var(--accent)',   '價格已自帶訊號'],

  const d = vr.date ? md(vr.date) + ' ' : '';

}

/* 日期簡寫 2026-08-16 → 8/16 */
function md(s){
  if (!s) return '';
  const p = String(s).split('-');
  return p.length === 3 ? `${+p[1]}/${+p[2]}` : s;
}

/* ================= Canvas 折線圖（單軸） ================= */
const tip = $('tip');
function chart(canvas, dates, series, opts){
  opts = opts || {};
  const P = palette();
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const padL=opts.padL!=null?opts.padL:48, padR=opts.padR!=null?opts.padR:12, padT=14, padB=24;
  const pw = w-padL-padR, ph = h-padT-padB;

  // 用迴圈求極值，不用 Math.min(...arr)：展開運算子在資料量大時會爆呼叫堆疊，
  // 資料擴充到 9.6 年後單圖可達數千點、疊圖更多，必須避開這個上限。
  let lo = Infinity, hi = -Infinity, cnt = 0;
  for (const s of series) for (const v of s.data){
    if (v == null || !isFinite(v)) continue;
    if (v < lo) lo = v; if (v > hi) hi = v; cnt++;
  }
  if(!cnt){ ctx.fillStyle=P.label; ctx.font='13px monospace'; ctx.fillText('無數據', w/2-24, h/2); return; }
  if(lo===hi){ lo-=1; hi+=1; }
  const m=(hi-lo)*0.08; lo-=m; hi+=m;
  const X = i => padL + pw*i/Math.max(dates.length-1,1);
  const Y = v => padT + ph*(1-(v-lo)/(hi-lo));

  ctx.strokeStyle=P.grid; ctx.fillStyle=P.label;
  ctx.font='10px "Space Mono", monospace'; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){
    const v=lo+(hi-lo)*g/3, y=Y(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    ctx.fillText(Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toFixed(2), 4, y+3);
  }
  for(let g=0; g<=4; g++){
    const i=Math.round((dates.length-1)*g/4);
    if (dates[i]) ctx.fillText(dates[i].slice(5), X(i)-14, h-6);
  }
  drawSeries(ctx, series, X, Y, P, dates, padT, padB, h);
  bindHover(canvas, dates, series, P, padL, pw);
}

function drawSeries(ctx, series, X, Y, P, dates, padT, padB, h){
  series.forEach(s=>{
    const color = P[s.c] || s.c;
    if(s.type==='markers'){
      ctx.fillStyle=color;
      s.data.forEach((v,i)=>{ if(v!=null){ ctx.beginPath(); ctx.arc(X(i),Y(v),3.4,0,7); ctx.fill(); }});
      return;
    }
    if(s.fill){
      const grad=ctx.createLinearGradient(0,padT,0,h-padB);
      grad.addColorStop(0,color+'33'); grad.addColorStop(1,color+'00');
      ctx.fillStyle=grad; ctx.beginPath(); let st=false;
      s.data.forEach((v,i)=>{ if(v==null)return; if(!st){ctx.moveTo(X(i),Y(v)); st=true;} else ctx.lineTo(X(i),Y(v)); });
      ctx.lineTo(X(dates.length-1),h-padB); ctx.lineTo(X(0),h-padB); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle=color; ctx.lineWidth=s.width||2;
    if(s.dash) ctx.setLineDash(s.dash);
    ctx.beginPath(); let st=false;
    s.data.forEach((v,i)=>{ if(v==null)return; if(!st){ctx.moveTo(X(i),Y(v)); st=true;} else ctx.lineTo(X(i),Y(v)); });
    ctx.stroke(); ctx.setLineDash([]);
  });
}
function bindHover(canvas, dates, series, P, padL, pw){
  canvas.onmousemove = e=>{
    const r=canvas.getBoundingClientRect();
    const i=Math.max(0,Math.min(dates.length-1,Math.round((e.clientX-r.left-padL)/pw*(dates.length-1))));
    let rows=`<b>${dates[i]}</b><br>`;
    series.forEach(s=>{ if(s.label && s.data[i]!=null)
      rows+=`<span style="color:${P[s.c]||s.c}">●</span> ${s.label}: ${(+s.data[i]).toFixed(s.dp!=null?s.dp:3)}<br>`; });
    tip.classList.remove('wide'); tip.innerHTML=rows; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+16, innerWidth-190)+'px';
    tip.style.top=(e.clientY+14)+'px';
  };
  canvas.onmouseleave = ()=> tip.style.display='none';
}

/* ================= 綜合疊圖（雙軸 + toggle） ================= */
function chartOverlay(canvas, dates, left, rights){
  // left: {data,color,label} 用左軸；rights: [{key,data,color,label}] 各自右軸(共用歸一化到右軸範圍)
  const P = palette();
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  const padL=52, padR=52, padT=14, padB=24;
  const pw = w-padL-padR, ph = h-padT-padB;
  const X = i => padL + pw*i/Math.max(dates.length-1,1);

  // 左軸範圍（價格）
  // 迴圈求極值（同上，避開展開運算子的堆疊上限）
  function range(arr){
    let lo=Infinity, hi=-Infinity, n=0;
    for(const v of arr){ if(v==null||!isFinite(v))continue; if(v<lo)lo=v; if(v>hi)hi=v; n++; }
    if(!n) return null;
    if(lo===hi){lo-=1;hi+=1;} const m=(hi-lo)*.08; return [lo-m,hi+m]; }
  const lRange = overlayOn.price && left.data.some(v=>v!=null) ? range(left.data) : null;
  // 右軸範圍：把所有開著的右軸序列合併取範圍
  const rActive = rights.filter(r=>overlayOn[r.key]);
  const rAll = rActive.flatMap(r=>r.data).filter(v=>v!=null&&isFinite(v));
  const rRange = rAll.length ? range(rAll) : null;

  const YL = v => lRange ? padT + ph*(1-(v-lRange[0])/(lRange[1]-lRange[0])) : null;
  const YR = v => rRange ? padT + ph*(1-(v-rRange[0])/(rRange[1]-rRange[0])) : null;

  // 網格 + 左軸刻度
  ctx.strokeStyle=P.grid; ctx.font='10px "Space Mono", monospace'; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){
    const y=padT+ph*g/3;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke();
    if(lRange){ const v=lRange[1]-(lRange[1]-lRange[0])*g/3;
      ctx.fillStyle=P.price; ctx.textAlign='left';
      ctx.fillText(Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':v.toFixed(v>=100?0:2), 4, y+3); }
    if(rRange){ const v=rRange[1]-(rRange[1]-rRange[0])*g/3;
      ctx.fillStyle=P.kl; ctx.textAlign='right';
      ctx.fillText(v.toFixed(2), w-4, y+3); }
  }
  ctx.textAlign='left'; ctx.fillStyle=P.label;
  for(let g=0; g<=4; g++){ const i=Math.round((dates.length-1)*g/4); if(dates[i]) ctx.fillText(dates[i].slice(5), X(i)-14, h-6); }

  const drawLine = (data, Y, color, width, dash, fill) => {
    if(!Y) return;
    if(fill){
      const grad=ctx.createLinearGradient(0,padT,0,h-padB);
      grad.addColorStop(0,color+'22'); grad.addColorStop(1,color+'00');
      ctx.fillStyle=grad; ctx.beginPath(); let st=false;
      data.forEach((v,i)=>{ if(v==null)return; if(!st){ctx.moveTo(X(i),Y(v));st=true;}else ctx.lineTo(X(i),Y(v)); });
      ctx.lineTo(X(dates.length-1),h-padB); ctx.lineTo(X(0),h-padB); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle=color; ctx.lineWidth=width; if(dash)ctx.setLineDash(dash);
    ctx.beginPath(); let st=false;
    data.forEach((v,i)=>{ if(v==null)return; if(!st){ctx.moveTo(X(i),Y(v));st=true;}else ctx.lineTo(X(i),Y(v)); });
    ctx.stroke(); ctx.setLineDash([]);
  };
  // 先畫右軸指數（襯底），再畫價格（主角在上）
  rActive.forEach(r => drawLine(r.data, YR, P[r.color]||r.color, 2, r.dash, false));
  if(lRange) drawLine(left.data, YL, P.price, 2.4, null, true);

  // hover
  const rows = [];
  if(overlayOn.price) rows.push({label:left.label, data:left.data, color:P.price, dp:2});
  rActive.forEach(r=>rows.push({label:r.label, data:r.data, color:P[r.color]||r.color, dp:3}));
  canvas.onmousemove = e=>{
    const rr=canvas.getBoundingClientRect();
    const i=Math.max(0,Math.min(dates.length-1,Math.round((e.clientX-rr.left-padL)/pw*(dates.length-1))));
    let html=`<b>${dates[i]}</b><br>`;
    rows.forEach(s=>{ if(s.data[i]!=null) html+=`<span style="color:${s.color}">●</span> ${s.label}: ${(+s.data[i]).toFixed(s.dp)}<br>`; });
    tip.classList.remove('wide'); tip.innerHTML=html; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+16, innerWidth-200)+'px'; tip.style.top=(e.clientY+14)+'px';
  };
  canvas.onmouseleave=()=> tip.style.display='none';
}

let _overlayCtx = null;

/* ================= 突破對照（事件研究） ================= */
function buildEvents(a){
  // 用完整序列（不受週期裁切影響，統計要全樣本）
  const dates=a.dates, kl=a.kl, q=a.kl_q95, close=a.close||[];
  const breaches=[];
  for(let i=0;i<dates.length;i++){
    if(kl[i]!=null && q && q[i]!=null && kl[i]>q[i] && close[i]!=null){
      // 避免連續突破重複計數：前一天沒突破才算「新事件」
      const prevBreach = i>0 && kl[i-1]!=null && q[i-1]!=null && kl[i-1]>q[i-1];
      breaches.push({ i, date:dates[i], kl:kl[i], q:q[i], px:close[i], isNew:!prevBreach });
    }
  }
  const events = breaches.filter(b=>b.isNew);
  const horizons=[1,3,5];
  const agg = {};
  horizons.forEach(hz=>{ agg[hz]={rets:[],up:0,n:0}; });
  events.forEach(ev=>{
    horizons.forEach(hz=>{
      const j=ev.i+hz;
      if(j<close.length && close[j]!=null && ev.px){
        const ret=(close[j]-ev.px)/ev.px*100;
        agg[hz].rets.push(ret); agg[hz].n++; if(ret>0)agg[hz].up++;
      }
    });
  });
  const box=$('eventStat');
  if(!events.length || !close.length){
    box.innerHTML=`<p style="color:var(--text-dim);font-size:.95rem;line-height:1.8">此標的在目前資料範圍內${!close.length?'沒有價格數據':'尚無散度突破事件'}，無法統計。</p>`;
    $('eventList').innerHTML=''; return;
  }
  const cardHtml = horizons.map(hz=>{
    const g=agg[hz]; if(!g.n) return '';
    const avg=g.rets.reduce((s,x)=>s+x,0)/g.n;
    const winrate=g.up/g.n*100;
    const col = avg>=0 ? 'var(--c-pos)' : 'var(--c-neg)';
    const barW = Math.min(100, Math.abs(avg)/Math.max(...horizons.map(H=>Math.abs(agg[H].n?agg[H].rets.reduce((s,x)=>s+x,0)/agg[H].n:0)),0.01)*100);
    return `<div style="display:grid;grid-template-columns:4.5rem 1fr auto;gap:1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--stroke)">
      <div style="font-family:var(--font-mono);font-size:.9rem;color:var(--text-dim)">T+${hz} 日</div>
      <div>
        <div style="font-size:1.5rem;font-weight:700;color:${col};font-variant-numeric:tabular-nums;letter-spacing:-.02em">${pct(avg)}</div>
        <div style="font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint);margin-top:.2rem">平均漲跌 · 樣本 ${g.n} 次</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums">${winrate.toFixed(0)}%</div>
        <div style="font-family:var(--font-mono);font-size:.72rem;color:var(--text-faint)">上漲勝率</div>
      </div>
    </div>`;
  }).join('');
  const t1=agg[3].n?agg[3].rets.reduce((s,x)=>s+x,0)/agg[3].n:0;
  const dir = t1>=0?'偏漲':'偏跌';
  box.innerHTML=`
    <div style="font-size:1rem;line-height:1.75;color:var(--text-dim);margin-bottom:.4rem">
      共偵測到 <b style="color:var(--accent)">${events.length}</b> 次散度突破。突破後 3 個交易日價格<b style="color:${t1>=0?'var(--c-pos)':'var(--c-neg)'}">${dir}（平均 ${pct(t1)}）</b>。
    </div>
    ${cardHtml}
    <p style="font-family:var(--font-mono);font-size:.7rem;color:var(--text-faint);margin-top:.9rem;line-height:1.7">
      * 事件＝散度首次突破警戒線當日；T+N＝其後第 N 個有價格的交易日。歷史統計非未來保證。
    </p>`;
  // 事件清單
  $('eventList').innerHTML = events.slice().reverse().map(ev=>{
    const j1=ev.i+1;
    const nextRet = (j1<close.length && close[j1]!=null && ev.px) ? (close[j1]-ev.px)/ev.px*100 : null;
    const col = nextRet==null?'var(--text-faint)':(nextRet>=0?'var(--c-pos)':'var(--c-neg)');
    return `<div class="art" style="cursor:default">
      <span class="chip neu">突破</span>
      <span class="t"><b>${ev.date}</b> · 散度 ${ev.kl.toFixed(3)}（警戒 ${ev.q.toFixed(3)}）</span>
      <span class="d">收盤 ${ev.px>=100?ev.px.toFixed(0):ev.px.toFixed(2)}<br><span style="color:${col}">T+1 ${nextRet==null?'—':pct(nextRet)}</span></span>
    </div>`;
  }).join('');
}

/* ================= 領先關係 ================= */
function teLane(name, te, p, dir, maxTe, color){
  const sig = p < 0.05;
  const hh = Math.max(3, Math.round(te / maxTe * 13));
  const head = dir === 'right'
    ? `right:-1px;border-top:${hh+5}px solid transparent;border-bottom:${hh+5}px solid transparent;border-left:${hh+9}px solid ${color};`
    : `left:-1px;border-top:${hh+5}px solid transparent;border-bottom:${hh+5}px solid transparent;border-right:${hh+9}px solid ${color};`;
  const margin = dir === 'right' ? `margin-right:${hh+8}px` : `margin-left:${hh+8}px`;
  return `<div class="lane">
    <div class="lbl2"><span>${name} · 強度 ${te.toFixed(4)}</span>
      <span>${sig ? `<b style="color:${color}">方向可信</b>` : `證據不足`}</span></div>
    <div style="position:relative;opacity:${sig?1:.38}">
      <div style="height:${hh}px;border-radius:99px;background:${color};${margin}"></div>
      <span style="position:absolute;top:50%;transform:translateY(-50%);width:0;height:0;${head}"></span>
    </div>
  </div>`;
}
function buildTE(a){
  const v = $('teVerdict'), g = $('teGrid');
  if (!a.te){ v.innerHTML = '<span style="color:var(--text-dim)">價格數據不足</span>'; g.innerHTML = ''; return; }
  const t = a.te, vd = verdictOf(t);
  v.innerHTML = `<span style="color:${vd.color}">${vd.txt}</span><span class="vsub">${vd.sub}</span>`;
  const maxTe = Math.max(t.news_to_price, t.price_to_news, 1e-9);
  g.innerHTML = `<div class="flow">
    <div class="node">新聞</div>
    <div>
      ${teLane('新聞 → 價格', t.news_to_price, t.p_news_to_price, 'right', maxTe, 'var(--accent)')}
      ${teLane('價格 → 新聞', t.price_to_news, t.p_price_to_news, 'left', maxTe, 'var(--text-dim)')}
    </div>
    <div class="node">價格</div>
  </div>`;
}

/* ================= 語料分類 ================= */
function buildCorpus(a){
  const arts=a.articles||[];
  if(!arts.length){ $('artList').innerHTML='<p style="color:var(--text-dim)">無頭條資料</p>'; $('distBar').innerHTML=''; $('corpusCount').innerHTML=''; return; }
  const d=a.corpus_dist||{pos:0,neu:0,neg:0,total:0};
  const LBL={pos:'看多',neu:'中性',neg:'看空'};
  $('corpusCount').innerHTML=
    `<span class="lgc" style="cursor:default;color:var(--c-pos)">看多 ${d.pos}</span>
     <span class="lgc" style="cursor:default">中性 ${d.neu}</span>
     <span class="lgc" style="cursor:default;color:var(--c-neg)">看空 ${d.neg}</span>`;
  const tot=Math.max(d.total,1);
  $('distBar').innerHTML=
    `<div style="width:${d.pos/tot*100}%;background:var(--c-pos)"></div>
     <div style="width:${d.neu/tot*100}%;background:var(--stroke-hi)"></div>
     <div style="width:${d.neg/tot*100}%;background:var(--c-neg)"></div>`;
  $('artList').innerHTML=arts.map(x=>`
    <a class="art" href="${x.url}" target="_blank" rel="noopener">
      <span class="chip ${x.label}">${LBL[x.label]}</span>
      <span class="t">${x.title.replace(/</g,'&lt;')}</span>
      <span class="d">${x.domain}<br>${x.date?x.date.slice(0,4)+'-'+x.date.slice(4,6)+'-'+x.date.slice(6,8):''}</span>
    </a>`).join('');
}

/* ================= 設定面板 ================= */
const FS_OPTS=[['m','標準'],['l','大'],['xl','特大']];
const CT_OPTS=[['std','標準'],['high','高對比']];
function buildPanel(){
  segBuild($('fsSeg'), FS_OPTS.map(o=>({label:o[1]})), FS_OPTS.findIndex(o=>o[0]===prefs.fs),
    i=>{ prefs.fs=FS_OPTS[i][0]; savePrefs(); applyPrefs(); buildPanel(); render(); });
  segBuild($('ctSeg'), CT_OPTS.map(o=>({label:o[1]})), CT_OPTS.findIndex(o=>o[0]===prefs.contrast),
    i=>{ prefs.contrast=CT_OPTS[i][0]; savePrefs(); applyPrefs(); buildPanel(); render(); });
}
$('fontBtn').onclick = () => $('panel').classList.toggle('open');
$('rpApply').onclick  = applyRangePicker;
$('rpCancel').onclick = () => $('rangePicker').classList.remove('open');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('rangePicker').classList.remove('open');
});
$('themeBtn').onclick = () => { prefs.theme = prefs.theme==='dark'?'light':'dark'; savePrefs(); applyPrefs(); render(); };
document.addEventListener('click', e => {
  const p=$('panel');
  if (p.classList.contains('open') && !p.contains(e.target) && e.target!==$('fontBtn') && !$('fontBtn').contains(e.target))
    p.classList.remove('open');
});

/* ================= 主渲染 ================= */
function render(){
  buildTabs();
  const tab = D.assets[cur];
  const a = activeAsset();
  const s = sliced(a);
  buildStats(a);
  buildTabbar();

  // 綜合疊圖
  _overlayCtx = { s };
  buildOverlayLegend();
  renderOverlay();

  // legend 顏色（三張核心圖）
  const P = palette();
  const lg = { lgVol:P.vol, lgSpike:P.mark, lgKl:P.kl, lgTh:P.thresh, lgPx:P.price, lgBr:P.thresh };
  for (const k in lg){ const el=$(k); if(el) el.style.background=lg[k]; }

  const spikes = s.vol.map((v,i)=> (s.attn_z[i]!=null && s.attn_z[i]>ATTN_TH) ? v : null);
  chart($('cVol'), s.dates, [
    {data:s.vol, c:'vol', fill:true, label:'新聞量%', dp:3},
    {data:spikes, c:'mark', type:'markers', label:'注意力激增'},
  ]);
  const breaches = s.kl.map((v,i)=> (v!=null && s.kl_q95 && s.kl_q95[i]!=null && v>s.kl_q95[i]) ? v : null);
  chart($('cKL'), s.dates, [
    {data:s.kl, c:'kl', fill:true, label:'散度', dp:3},
    {data:s.kl_q95||[], c:'thresh', dash:[5,5], width:1.6, label:'警戒線', dp:3},
    {data:breaches, c:'thresh', type:'markers', label:'突破'},
  ]);
  if (s.close && s.close.length){
    const pxBreach = s.close.map((v,i)=> breaches[i]!=null ? v : null);
    chart($('cPx'), s.dates, [
      {data:s.close, c:'price', fill:true, label:'收盤', dp:2},
      {data:pxBreach, c:'thresh', type:'markers', label:'散度突破日'},
    ]);
  } else chart($('cPx'), s.dates, [{data:[], c:'price'}]);

  // 次要分頁
  if (tab.is_group) buildUS(tab);
  buildEvents(a);
  buildTE(a);
  buildCorpus(a);
  buildTrust(a);
}

/* ================= 資訊 tooltip ================= */
function showInfoTip(el){
  tip.classList.add('wide'); tip.innerHTML = el.getAttribute('data-tip'); tip.style.display='block';
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth-330)) + 'px';
  tip.style.top = (r.bottom + 8) + 'px';
}
function hideInfoTip(){ tip.style.display='none'; tip.classList.remove('wide'); }
document.addEventListener('mouseover', e => { const t=e.target.closest&&e.target.closest('.info'); if(t)showInfoTip(t); });
document.addEventListener('mouseout',  e => { if(e.target.closest&&e.target.closest('.info'))hideInfoTip(); });
document.addEventListener('focusin',   e => { const t=e.target.closest&&e.target.closest('.info'); if(t)showInfoTip(t); });
document.addEventListener('focusout',  e => { if(e.target.closest&&e.target.closest('.info'))hideInfoTip(); });

applyPrefs(); buildStamp(); buildPanel(); render();
addEventListener('resize', render);
</script>
