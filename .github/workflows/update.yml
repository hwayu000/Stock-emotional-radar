name: update-data

on:
  schedule:
    # 混合排程：美股活躍時段(台灣 21:30–06:00)密、亞洲盤後疏；
    # 各次間隔 ≥2h 讓 GDELT 限流有喘息，避免撞 90 分鐘長輪。
    # 資料本身是日線，一天實質只變一次；密的是「時間戳新鮮度」非數據。
    - cron: "0 14 * * *"   # UTC 14 = 台灣 22（美股早盤）
    - cron: "0 16 * * *"   # UTC 16 = 台灣 00
    - cron: "0 18 * * *"   # UTC 18 = 台灣 02（美股午盤）
    - cron: "0 20 * * *"   # UTC 20 = 台灣 04
    - cron: "0 22 * * *"   # UTC 22 = 台灣 06（美股收盤後）
    - cron: "0 2 * * *"    # UTC 02 = 台灣 10（亞洲早盤）
    - cron: "0 6 * * *"    # UTC 06 = 台灣 14
    - cron: "0 10 * * *"   # UTC 10 = 台灣 18（亞洲盤後）
  workflow_dispatch:         # 也可在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 跨執行共用 GDELT 快取：超時被取消的輪次，已抓到的部分留給下一輪續傳
      - uses: actions/cache/restore@v4
        with:
          path: cache
          key: gdelt-${{ github.run_id }}
          restore-keys: gdelt-

      - name: Write alert config from secrets
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_TOKEN" ]; then
            printf '{"telegram_bot_token":"%s","telegram_chat_id":"%s"}' "$TG_TOKEN" "$TG_CHAT" > alert_config.json
          fi

      - name: Run pipeline
        run: python radar.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.js
          git diff --cached --quiet || git commit -m "auto: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache
          key: gdelt-${{ github.run_id }}
